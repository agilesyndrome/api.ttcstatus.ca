name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    persist-credentials: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run build:storybook
      - run: npx wrangler deploy --dry-run -c workers/api/wrangler.jsonc
      - run: npx wrangler deploy --dry-run -c workers/map-generator/wrangler.jsonc
      - run: npx playwright install --with-deps chromium
      - name: Verify browser flows and component stories
        shell: bash
        run: |
          npm run dev:viewer > /tmp/ttc-ui.log 2>&1 &
          ui_pid=$!
          npm run storybook > /tmp/ttc-stories.log 2>&1 &
          stories_pid=$!
          trap 'kill "$ui_pid" "$stories_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null && curl --fail --silent http://127.0.0.1:6006/index.json > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          curl --fail --silent http://127.0.0.1:6006/index.json > /dev/null
          npm run test:ui
          npm run test:auth
          npm run test:mobile
          npm run test:hackathon
          npm run test:exploration
          npm run test:collection
          npm run test:snake
          npm run test:stories
