<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f5ed" />
    <!-- Painted before first frame so a stored dark preference never flashes
         the light page; mirrors useTheme, which stays the source of truth. -->
    <script>
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem('ttc:theme:v1'));
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (!dark) return;
          document.documentElement.dataset.theme = 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#111f29');
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="{{i18n:app.exploreTorontoSStreetcarNetworkAndLiveTtcVehiclePositions}}"
      data-i18n-content="app.exploreTorontoSStreetcarNetworkAndLiveTtcVehiclePositions"
    />
    <title data-i18n="app.title">{{i18n:app.title}}</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      ><span data-i18n="app.enableJavascriptToExploreTheTtcStatusMap"
        >{{i18n:app.enableJavascriptToExploreTheTtcStatusMap}}</span
      ></noscript
    >
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
